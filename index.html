<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>크롬 공룡점프</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;background:#f7f7f7;color:#535353;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden;-ms-touch-action:manipulation;touch-action:manipulation}
.screen{display:none;position:absolute;left:0;top:0;right:0;bottom:0;padding:20px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
.wrap{max-width:480px;margin:0 auto;text-align:center}
.center{min-height:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center}
h1{margin:0 0 8px;font-size:30px}
p{margin:6px 0 14px;font-size:14px;opacity:.75;line-height:1.5}
input{display:block;width:100%;font-size:18px;padding:14px;border:2px solid #535353;border-radius:10px;text-align:center;background:#fff;color:#535353;margin-bottom:12px;-webkit-user-select:text;user-select:text;-webkit-appearance:none}
button{display:block;width:100%;font-size:20px;font-weight:700;padding:15px;border:0;border-radius:10px;background:#535353;color:#fff;margin-bottom:10px;-webkit-appearance:none}
button.sub{background:#ddd;color:#535353;font-size:15px;padding:11px}
button:disabled{opacity:.4}
ol{list-style:none;margin:0 0 14px;padding:0;background:#fff;border:2px solid #ddd;border-radius:10px;overflow:hidden;text-align:left}
li{display:-webkit-flex;display:flex;padding:8px 14px;font-size:16px;border-bottom:1px solid #eee}
li:last-child{border-bottom:0}
li span.r{width:30px;font-weight:700}
li span.n{-webkit-flex:1;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.me{background:#fff3e0;color:#e8590c;font-weight:700}
li.empty{display:block;text-align:center;opacity:.6}
.big{font-size:46px;font-weight:800;margin:6px 0}
#s-play{padding:0;background:#fff}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#err{display:none;position:fixed;left:0;right:0;top:0;background:#c92a2a;color:#fff;font-size:12px;padding:6px 10px;z-index:9;word-break:break-all}
</style>
</head>
<body>
<div id="err"></div>

<div id="s-name" class="screen on"><div class="wrap center">
  <h1>🦖 크롬 공룡점프</h1>
  <p>결승선까지 가장 빨리 도착하세요!<br>장애물에 닿으면 +2초 페널티</p>
  <input id="name" maxlength="12" placeholder="이름 입력 (최대 12자)" autocomplete="off">
  <button id="enter">입장</button>
</div></div>

<div id="s-lobby" class="screen"><div class="wrap">
  <h1>🏆 TOP 10</h1>
  <ol id="lobby-rank"></ol>
  <button id="start">시작</button>
  <button id="rename" class="sub">이름 변경</button>
</div></div>

<div id="s-play" class="screen"><canvas id="cv" width="480" height="270"></canvas></div>

<div id="s-result" class="screen"><div class="wrap">
  <p>완료 시간</p>
  <div class="big" id="res-time"></div>
  <p id="res-msg"></p>
  <ol id="res-rank"></ol>
  <button id="again">다시하기</button>
  <button id="tolobby" class="sub">로비로</button>
</div></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
function showErr(m){var e=$('err');e.style.display='block';e.textContent='오류: '+m}
window.onerror=function(m){showErr(m)};

var W=480,H=270,GROUND=220,GOAL=9000,SPEED=300,PENALTY=2000,JUMP_V=620,GRAV=1800;
var URL_=(window.SUPABASE_URL||'').replace(/\/$/,''),KEY=window.SUPABASE_ANON_KEY||'';
var mem={};
function sget(k){try{var v=localStorage.getItem(k);return v===null?(mem[k]||null):v}catch(e){return mem[k]||null}}
function sset(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
var player=sget('dino_name')||'';

/* ---------- 유틸 ---------- */
function show(id){var s=document.querySelectorAll('.screen');for(var i=0;i<s.length;i++)s[i].className='screen'+(s[i].id===id?' on':'')}
function fmt(ms){return (ms/1000).toFixed(2)+'초'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function on(el,ev,fn){el.addEventListener(ev,fn,false)}

/* ---------- 랭킹: Supabase REST (라이브러리 없이 fetch/XHR) ---------- */
function req(method,path,body,cb){
  var x=new XMLHttpRequest();
  x.open(method,URL_+path,true);
  x.setRequestHeader('apikey',KEY);
  x.setRequestHeader('Content-Type','application/json');
  x.timeout=8000;
  x.onload=function(){var d=null;try{d=JSON.parse(x.responseText)}catch(e){}cb(x.status>=200&&x.status<300?null:(d&&d.message)||('HTTP '+x.status),d)};
  x.onerror=x.ontimeout=function(){cb('network',null)};
  x.send(body?JSON.stringify(body):null);
}
function localRank(){try{return JSON.parse(sget('dino_local_rank')||'[]')}catch(e){return []}}
function fetchRank(cb){
  if(!URL_||!KEY)return cb(localRank());
  req('GET','/rest/v1/rankings?select=name,time_ms&order=time_ms.asc,created_at.asc&limit=10',null,function(err,d){
    cb(err||!d?localRank():d);
  });
}
function submit(name,ms,cb){
  if(URL_&&KEY){
    req('POST','/rest/v1/rpc/submit_score',{p_name:name,p_time_ms:ms},function(err,d){
      if(!err)return cb(typeof d==='number'?d:null,true);
      saveLocal(name,ms,cb);
    });
  }else saveLocal(name,ms,cb);
}
function saveLocal(name,ms,cb){
  var l=localRank();l.push({name:name,time_ms:ms});
  l.sort(function(a,b){return a.time_ms-b.time_ms});
  var r=0;for(var i=0;i<l.length;i++)if(l[i].name===name&&l[i].time_ms===ms){r=i+1;break}
  sset('dino_local_rank',JSON.stringify(l.slice(0,10)));
  cb(r<=10?r:null,false);
}
function renderRank(el,rows,my){
  if(!rows.length){el.innerHTML='<li class="empty">아직 기록이 없어요. 첫 기록의 주인공이 되세요!</li>';return}
  var h='';for(var i=0;i<rows.length;i++)h+='<li'+(my===i+1?' class="me"':'')+'><span class="r">'+(i+1)+'</span><span class="n">'+esc(rows[i].name)+'</span><span>'+fmt(rows[i].time_ms)+'</span></li>';
  el.innerHTML=h;
}
function lobby(){show('s-lobby');$('lobby-rank').innerHTML='<li class="empty">불러오는 중…</li>';fetchRank(function(r){renderRank($('lobby-rank'),r,0)})}

/* ---------- 입장 ---------- */
var nameEl=$('name');nameEl.value=player;
function enter(){var v=nameEl.value.replace(/^\s+|\s+$/g,'').slice(0,12);if(!v){nameEl.focus();return}player=v;sset('dino_name',v);lobby()}
on($('enter'),'click',enter);
on(nameEl,'keydown',function(e){if(e.keyCode===13)enter()});
on($('rename'),'click',function(){show('s-name')});
on($('tolobby'),'click',lobby);
on($('start'),'click',startGame);
on($('again'),'click',startGame);

/* ---------- 게임 ---------- */
var cv=$('cv'),cx=cv.getContext('2d');
function resize(){
  var w=window.innerWidth,h=window.innerHeight,s=Math.min(w/W,h/H);
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.floor(w*(window.devicePixelRatio||1));cv.height=Math.floor(h*(window.devicePixelRatio||1));
  view.s=s*(window.devicePixelRatio||1);
  view.ox=(cv.width-W*view.s)/2;view.oy=(cv.height-H*view.s)/2;
}
var view={s:1,ox:0,oy:0};
window.addEventListener('resize',resize,false);

function rng(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function makeObstacles(){
  var r=rng(20240607),o=[],x=900;
  while(x<GOAL-500){
    var t=r(),w=t<.4?22:t<.8?30:52,h=t<.4?36:t<.8?52:40;
    o.push({x:x,w:w,h:h,hit:false});
    x+=380+Math.floor(r()*260);
  }
  return o;
}
var G=null,raf=0;
function now(){return window.performance&&performance.now?performance.now():+new Date()}
function startGame(){
  show('s-play');resize();
  G={obs:makeObstacles(),dx:0,y:0,vy:0,hits:0,inv:0,state:'count',cd:3,cdT:now(),t0:0,last:0,elapsed:0};
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function jump(){if(G&&G.state==='run'&&G.y===0)G.vy=JUMP_V}
var playEl=$('s-play');
on(playEl,'touchstart',function(e){e.preventDefault();jump()});
on(playEl,'mousedown',function(){jump()});
on(document,'keydown',function(e){if(e.keyCode===32||e.keyCode===38){e.preventDefault();if(playEl.className.indexOf('on')>-1)jump()}});

function loop(t){
  if(!G)return;
  if(G.state==='count'){
    var left=3-Math.floor((t-G.cdT)/700);
    if(left<=0){G.state='run';G.t0=t;G.last=t}else G.cd=left;
  }else if(G.state==='run'){
    var dt=Math.min((t-G.last)/1000,.05);G.last=t;
    G.dx+=SPEED*dt;
    G.vy-=GRAV*dt;G.y+=G.vy*dt;
    if(G.y<=0){G.y=0;G.vy=0}
    G.inv=Math.max(0,G.inv-dt);
    var px=G.dx+80,pw=28;
    for(var i=0;i<G.obs.length;i++){
      var o=G.obs[i];if(o.hit)continue;
      if(px+pw-6>o.x+4&&px+6<o.x+o.w-4&&G.y<o.h-8){o.hit=true;G.hits++;G.inv=.8}
    }
    G.elapsed=t-G.t0;
    if(G.dx>=GOAL){draw(t);finish();return}
  }
  draw(t);
  raf=requestAnimationFrame(loop);
}
function total(){return Math.round(G.elapsed+G.hits*PENALTY)}

function rect(x,y,w,h){cx.fillRect(x,y,w,h)}
function cactus(x,h,w){
  var b=GROUND;rect(x+w/2-5,b-h,10,h);
  rect(x,b-h*.65,w/2,7);rect(x,b-h*.65-14,7,14);
  if(w>26){rect(x+w/2,b-h*.45,w/2,7);rect(x+w-7,b-h*.45-14,7,14)}
}
function dino(x,y,air,t){
  cx.fillStyle='#535353';
  rect(x+8,y-40,22,16);rect(x+24,y-34,12,8);
  rect(x+4,y-26,22,18);rect(x-4,y-22,10,6);rect(x+26,y-22,8,4);
  cx.fillStyle='#fff';rect(x+22,y-37,4,4);cx.fillStyle='#535353';
  var f=air?0:Math.floor(t/90)%2;
  rect(x+6,y-8,6,8+(f?0:-3));rect(x+18,y-8,6,8+(f?-3:0));
}
function draw(t){
  cx.setTransform(1,0,0,1,0,0);
  cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
  cx.setTransform(view.s,0,0,view.s,view.ox,view.oy);
  cx.fillStyle='#535353';
  rect(-W,GROUND,W*3,2);
  var i;for(i=0;i<30;i++){var gx=((i*97-G.dx)%W+W)%W;rect(gx,GROUND+8+(i%3)*8,6,2)}
  var fx=GOAL+80-G.dx;
  if(fx<W+20){
    for(i=0;i<8;i++){cx.fillStyle=i%2?'#000':'#fff';rect(fx,GROUND-80+i*10,10,10);cx.fillStyle=i%2?'#fff':'#000';rect(fx+10,GROUND-80+i*10,10,10)}
    cx.strokeStyle='#000';cx.strokeRect(fx,GROUND-80,20,80);
  }
  cx.fillStyle='#535353';
  for(i=0;i<G.obs.length;i++){
    var o=G.obs[i];if(o.hit)continue;
    var sx=o.x-G.dx;if(sx<-60||sx>W+10)continue;
    if(o.w>40){cactus(sx,o.h,22);cactus(sx+28,o.h*.8,22)}else cactus(sx,o.h,o.w);
  }
  if(!(G.inv>0&&Math.floor(t/80)%2))dino(80,GROUND-G.y,G.y>0,t);
  cx.fillStyle='#535353';cx.font='bold 18px sans-serif';cx.textAlign='left';
  cx.fillText((total()/1000).toFixed(2)+'초',12,26);
  cx.textAlign='right';cx.fillText(G.hits?'페널티 ×'+G.hits:'',W-12,26);
  cx.fillStyle='#ddd';rect(12,36,W-24,6);cx.fillStyle='#e8590c';rect(12,36,(W-24)*Math.min(1,G.dx/GOAL),6);
  cx.fillStyle='#999';cx.font='13px sans-serif';cx.textAlign='center';
  if(G.state==='count'){
    cx.fillStyle='rgba(255,255,255,.75)';rect(0,0,W,H);
    cx.fillStyle='#535353';cx.font='bold 80px sans-serif';cx.fillText(String(G.cd),W/2,GROUND-50);
    cx.font='14px sans-serif';cx.fillText('화면을 터치하면 점프!',W/2,GROUND-10);
  }
}

function finish(){
  var ms=total(),hits=G.hits;G.state='done';cancelAnimationFrame(raf);
  show('s-result');
  $('res-time').textContent=fmt(ms);
  $('res-msg').textContent='기록 저장 중…';
  $('res-rank').innerHTML='';
  $('again').disabled=true;
  submit(player,ms,function(rank,online){
    $('res-msg').textContent=(rank?'🎉 '+rank+'위 등록!':'아쉽게 TOP 10 진입 실패')+' · 충돌 '+hits+'회'+(online?'':' (오프라인 저장)');
    fetchRank(function(r){renderRank($('res-rank'),r,rank);$('again').disabled=false});
  });
}
})();
</script>
</body>
</html>
